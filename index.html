<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>护理循环</title>
  <style>
    :root {
      --ios-bg: #f2f2f7;
      --ios-label: #000000;
      --ios-secondary: rgba(60, 60, 67, 0.6);
      --ios-tertiary: rgba(60, 60, 67, 0.3);
      --ios-today: #ff3b30;
      --accent: #31b86a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--ios-bg);
      color: var(--ios-label);
      padding: calc(8px + env(safe-area-inset-top)) 0 calc(80px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    .shell {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .month-block {
      margin-bottom: 8px;
    }

    .cal-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      padding: 12px 4px 8px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--ios-bg);
      padding-top: calc(12px + env(safe-area-inset-top));
      margin-top: calc(-8px - env(safe-area-inset-top));
    }

    .month-block:first-child .cal-title {
      margin-top: 0;
      padding-top: 12px;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-secondary);
      padding: 0 0 6px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 0 0;
      padding-bottom: 8px;
    }

    .cal-cell {
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1px 2px 2px;
      font-size: 16px;
      font-weight: 400;
      color: var(--ios-label);
      cursor: pointer;
      border-radius: 8px;
      -webkit-user-select: none;
      user-select: none;
    }

    .cal-cell:active {
      background: rgba(0, 0, 0, 0.04);
    }

    /* 仅「今天」可点；其余日期仅展示 */
    .cal-cell[data-datekey]:not(.is-today) {
      pointer-events: none;
      cursor: default;
    }

    .cal-cell[data-datekey]:not(.is-today):active {
      background: transparent;
    }

    .cal-cell--pad {
      pointer-events: none;
      min-height: 64px;
      padding: 1px 2px 2px;
      cursor: default;
    }

    /*
      对齐：大圆把「数字+农历」包在一起会与其它格「上数字、下农历」的基准行不一致。
      改为统一两行：第一行固定高度只放公历；红圈只包住数字。农历在第二行（今天用浅红字强调）。
    */
    .cal-day-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      width: 46px;
      box-sizing: border-box;
      gap: 0;
    }

    .cal-day-line1 {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .cal-day-line2 {
      min-height: 11px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-day-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      color: var(--ios-label);
    }

    .cal-lunar {
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-weight: 400;
      color: rgba(60, 60, 67, 0.45);
      text-align: center;
      max-width: 100%;
      padding: 1px 4px;
      position: relative;
      top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cal-lunar--hidden {
      visibility: hidden;
    }

    .cal-day-bubble.is-today .cal-day-num {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      background: var(--ios-today);
      font-weight: 600;
      color: #fff;
      font-size: 18px;
    }

    .cal-day-bubble.is-today .cal-lunar {
      color: rgba(255, 59, 48, 0.82);
      font-weight: 500;
    }

    .cal-day-bubble.is-today-recorded .cal-day-num {
      width: auto;
      height: auto;
      min-width: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 400;
      color: var(--ios-today);
    }

    /* 仅法定节假日 */
    .cal-fest-row {
      margin-top: 3px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      gap: 3px 4px;
      max-width: 100%;
    }

    .cal-fest--legal {
      font-size: 12px;
      line-height: 1.15;
      font-weight: 400;
      color: rgba(0, 122, 255, 0.42);
      text-align: center;
      max-width: 100%;
    }

    /* 仅“法定节假日文字”下移，休/班 badge 不移动 */
    .cal-fest-name {
      position: relative;
      top: 0;
      font-size: 10px;
      color: rgba(0, 122, 255, 0.62);
    }

    .cal-badge {
      display: inline-block;
      margin-left: 2px;
      padding: 0 3px;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.3;
      border-radius: 2px;
      vertical-align: 0px;
    }

    .cal-badge--off,
    .cal-badge--work {
      background: rgba(0, 122, 255, 0.1);
      color: rgba(0, 122, 255, 0.48);
    }

    .cal-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      padding: 1px 4px;
      border-radius: 3px;
      background: #1dbc52;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.15;
      color: #fff;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .cal-label[aria-hidden="true"] {
      visibility: hidden;
      background: transparent;
      padding: 0;
      min-height: 16px;
      min-width: 1px;
    }

    .footer-actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      background: linear-gradient(to top, var(--ios-bg) 70%, transparent);
      pointer-events: none;
      z-index: 10;
    }

    .footer-actions button {
      pointer-events: auto;
    }

    .reset-btn {
      border: none;
      background: transparent;
      color: #b0b4ba;
      font-size: 12px;
      padding: 10px 6px;
      cursor: pointer;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: rgba(176, 180, 186, 0.5);
      font-size: 12px;
      padding: 10px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="monthsRoot"></div>
  </div>

  <div class="footer-actions">
    <button id="resetBtn" class="reset-btn" type="button">从头开始</button>
    <button id="deleteBtn" class="delete-btn" type="button">删除</button>
  </div>

  <!-- 1.7.4 及更早内置放假数据不含 2026+；1.7.7 起含近年国务院安排 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const cycle = [
      "自然堂",
      "无印",
      "百雀羚",
      "兰芝",
      "火+自",
      "无印",
      "百雀羚",
      "兰芝"
    ];

    const STORE_KEY = "hair-care-cycle-v2";
    const STORE_LEGACY = "hair-care-cycle-v1";
    const DELETE_PASSWORD = "18823286062";
    const PRESET_HISTORY = [
      { dateKey: "2026-04-22", careType: "自然堂", stepIndex: 0 },
      { dateKey: "2026-04-24", careType: "无印", stepIndex: 1 },
      { dateKey: "2026-04-26", careType: "百雀羚", stepIndex: 2 }
    ];

    const MONTH_RANGE_PAST = 18;
    const MONTH_RANGE_FUTURE = 12;

    const monthsRoot = document.getElementById("monthsRoot");
    const resetBtn = document.getElementById("resetBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    let lastLongPressAt = 0;
    const LONG_PRESS_CLICK_GUARD_MS = 1200;
    let suppressClickAfterLongPress = false;
    let suppressClearTimer = null;
    let lpTimer = null;
    let lpStartX = 0;
    let lpStartY = 0;

    const state = loadState();

    function emptyState() {
      return { index: 0, items: [] };
    }

    /**
     * 按日期先后把记录对齐到 cycle 的第 0、1、2… 步。
     * 修正曾因 index 未同步导致的「同一天记成自然堂」等问题，并刷新 index。
     */
    function repairSequentialCycleFromDates(state) {
      if (!state.items.length) {
        return state.index === 0 ? state : { ...state, index: 0 };
      }
      const sorted = [...state.items].sort((a, b) => a.dateKey.localeCompare(b.dateKey));
      const repaired = sorted.map((it, i) => ({
        ...it,
        stepIndex: i % cycle.length,
        careType: cycle[i % cycle.length]
      }));
      const nextIndex = repaired.length % cycle.length;
      const byDate = new Map(state.items.map((x) => [x.dateKey, x]));
      const unchanged =
        state.index === nextIndex &&
        repaired.every((it) => {
          const o = byDate.get(it.dateKey);
          return o && o.stepIndex === it.stepIndex && o.careType === it.careType;
        });
      return unchanged ? state : { ...state, items: repaired, index: nextIndex };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          let s = normalizeState(parsed);
          s = migrateCareTypeLabels(s);
          s = applyPresetHistory(s);
          s = repairSequentialCycleFromDates(s);
          if (JSON.stringify(s) !== raw) saveState(s);
          return s;
        }
        const legacy = localStorage.getItem(STORE_LEGACY);
        if (legacy) {
          let migrated = migrateFromV1(JSON.parse(legacy));
          migrated = migrateCareTypeLabels(migrated);
          migrated = applyPresetHistory(migrated);
          migrated = repairSequentialCycleFromDates(migrated);
          saveState(migrated);
          return migrated;
        }
      } catch (_) {}
      let initial = applyPresetHistory(emptyState());
      initial = repairSequentialCycleFromDates(initial);
      saveState(initial);
      return initial;
    }

    function normalizeState(parsed) {
      const index = Number.isInteger(parsed.index) ? parsed.index % cycle.length : 0;
      const items = Array.isArray(parsed.items)
        ? parsed.items.filter((x) => x && x.dateKey && x.careType && Number.isInteger(x.stepIndex))
        : [];
      return { index, items };
    }

    /** 旧版两字/长名称 → 当前 cycle 展示名（只改已存记录的 careType 文案） */
    function migrateCareTypeLabels(current) {
      const map = {
        自然: "自然堂",
        百雀: "百雀羚",
        蓝芝: "兰芝",
        火自: "火+自",
        无印良品: "无印",
        "火山泥+自然堂": "火+自"
      };
      let changed = false;
      const items = current.items.map((it) => {
        const next = map[it.careType];
        if (next && next !== it.careType) {
          changed = true;
          return { ...it, careType: next };
        }
        return it;
      });
      return changed ? { ...current, items } : current;
    }

    function migrateFromV1(parsed) {
      const records = Array.isArray(parsed.records) ? parsed.records : [];
      const byDay = new Map();
      for (const r of records) {
        const dk = parseRecordDayKey(r.date);
        if (!dk) continue;
        const prev = byDay.get(dk);
        if (!prev || String(r.date).localeCompare(prev.t) > 0) {
          byDay.set(dk, { dateKey: dk, careType: r.careType, t: r.date });
        }
      }
      const sorted = [...byDay.values()].sort((a, b) => a.t.localeCompare(b.t));
      const items = sorted.map((r, i) => ({
        dateKey: r.dateKey,
        careType: r.careType,
        stepIndex: i % cycle.length
      }));
      const idx = Number.isInteger(parsed.index) ? parsed.index % cycle.length : items.length % cycle.length;
      return { index: idx, items };
    }

    function saveState(current) {
      localStorage.setItem(STORE_KEY, JSON.stringify(current));
    }

    function itemByDateKey(items, dateKey) {
      return items.find((x) => x.dateKey === dateKey) || null;
    }

    function removeItemByDateKey(items, dateKey) {
      return items.filter((x) => x.dateKey !== dateKey);
    }

    function applyPresetHistory(current) {
      const items = [...current.items];
      let changed = false;
      for (const preset of PRESET_HISTORY) {
        if (itemByDateKey(items, preset.dateKey)) continue;
        items.push({ ...preset });
        changed = true;
      }
      if (!changed) return current;
      items.sort((a, b) => a.dateKey.localeCompare(b.dateKey));
      return { ...current, items };
    }

    function parseRecordDayKey(dateStr) {
      const part = String(dateStr).split(/\s/)[0];
      const m = part.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /** 农历 + 仅法定节假日（休/班）—— 数据来自 lunar-javascript */
    /** @param m JS Date 月份 0–11，库接口要用公历 1–12 */
    function buildDayCalendarExtras(y, m, d) {
      const empty = { lunarHtml: "", festHtml: "" };
      if (typeof Solar === "undefined" || typeof HolidayUtil === "undefined") return empty;
      try {
        const monthSolar = m + 1;
        const solar = Solar.fromYmd(y, monthSolar, d);
        const lunar = solar.getLunar();
        const lunarText = lunar.getDayInChinese();
        const lunarHtml = `<span class="cal-lunar">${escapeHtml(lunarText)}</span>`;

        const hol = HolidayUtil.getHoliday(y, monthSolar, d);
        if (!hol) {
          return { lunarHtml, festHtml: "" };
        }

        const badge = hol.isWork() ? "班" : "休";
        const badgeCls = hol.isWork() ? "cal-badge--work" : "cal-badge--off";
        const festName = escapeHtml(hol.getName());
        const festHtml = `<div class="cal-fest-row"><span class="cal-fest--legal"><span class="cal-fest-name">${festName}</span><span class="cal-badge ${badgeCls}">${badge}</span></span></div>`;

        return { lunarHtml, festHtml };
      } catch (_) {
        return empty;
      }
    }

    function buildMonthsRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth() - MONTH_RANGE_PAST, 1);
      const end = new Date(now.getFullYear(), now.getMonth() + MONTH_RANGE_FUTURE + 1, 0);
      const list = [];
      const cur = new Date(start);
      while (cur <= end) {
        list.push({ y: cur.getFullYear(), m: cur.getMonth() });
        cur.setMonth(cur.getMonth() + 1);
      }
      return list;
    }

    function renderMonthBlock(y, m, itemsMap, todayY, todayM, todayD) {
      const first = new Date(y, m, 1);
      const lastDay = new Date(y, m + 1, 0).getDate();
      const startWeekday = first.getDay();
      const leadPad = startWeekday;
      const bodyCount = lastDay;
      const tailPad = (7 - ((leadPad + bodyCount) % 7)) % 7;

      const idAttr = y === todayY && m === todayM ? ` id="month-current"` : "";

      const leadHtml = Array.from(
        { length: leadPad },
        () => '<div class="cal-cell cal-cell--pad" aria-hidden="true"></div>'
      ).join("");

      const daysHtml = [];
      for (let d = 1; d <= lastDay; d++) {
        const dateKey = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const rec = itemsMap.get(dateKey);
        const isToday =
          todayY === y && todayM === m && d === todayD;
        const cls = ["cal-cell", rec ? "has-care" : "", isToday ? "is-today" : ""]
          .filter(Boolean)
          .join(" ");

        const extra = buildDayCalendarExtras(y, m, d);

        const line2Html = rec
          ? `<span class="cal-label">${escapeHtml(rec.careType)}</span>`
          : `<span class="cal-label" aria-hidden="true"></span>`;

        const bubbleCls = `cal-day-bubble${isToday ? " is-today" : ""}${isToday && rec ? " is-today-recorded" : ""}`;
        daysHtml.push(
          `<div class="${cls}" data-datekey="${dateKey}" data-has="${rec ? "1" : "0"}" role="button" tabindex="0"><div class="${bubbleCls}"><div class="cal-day-line1"><span class="cal-day-num">${d}</span></div><div class="cal-day-line2">${rec ? line2Html : extra.lunarHtml}</div></div>${extra.festHtml}${!rec ? line2Html : ""}</div>`
        );
      }

      const tailHtml = Array.from(
        { length: tailPad },
        () => '<div class="cal-cell cal-cell--pad" aria-hidden="true"></div>'
      ).join("");

      const gridHtml = leadHtml + daysHtml.join("") + tailHtml;

      return `<section class="month-block"${idAttr} data-year="${y}" data-month="${m}">
        <h2 class="cal-title">${y}年${m + 1}月</h2>
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="cal-grid">${gridHtml}</div>
      </section>`;
    }

    function render() {
      const itemsMap = new Map();
      for (const it of state.items) {
        itemsMap.set(it.dateKey, it);
      }

      const today = new Date();
      const todayY = today.getFullYear();
      const todayM = today.getMonth();
      const todayD = today.getDate();

      const parts = buildMonthsRange().map(({ y, m }) =>
        renderMonthBlock(y, m, itemsMap, todayY, todayM, todayD)
      );
      monthsRoot.innerHTML = parts.join("");

      requestAnimationFrame(() => {
        const el = document.getElementById("month-current");
        if (el) el.scrollIntoView({ block: "start", behavior: "auto" });
      });
    }

    function getCellFromTarget(target) {
      const cell = target.closest(".cal-cell");
      if (!cell) return null;
      const dk = cell.getAttribute("data-datekey");
      if (!dk) return null;
      return { cell, dateKey: dk };
    }

    monthsRoot.addEventListener(
      "click",
      (e) => {
        if (suppressClickAfterLongPress) {
          suppressClickAfterLongPress = false;
          if (suppressClearTimer) {
            clearTimeout(suppressClearTimer);
            suppressClearTimer = null;
          }
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (Date.now() - lastLongPressAt < LONG_PRESS_CLICK_GUARD_MS) {
          e.preventDefault();
          return;
        }
        const hit = getCellFromTarget(e.target);
        if (!hit) return;
        if (!hit.cell.classList.contains("is-today")) return;

        if (itemByDateKey(state.items, hit.dateKey)) return;

        const careType = cycle[state.index];
        const stepIndex = state.index;
        state.items.push({ dateKey: hit.dateKey, careType, stepIndex });
        state.index = (state.index + 1) % cycle.length;
        saveState(state);
        render();
      },
      true
    );

    function cancelLongPressTimer() {
      if (lpTimer) {
        clearTimeout(lpTimer);
        lpTimer = null;
      }
    }

    function attachPointerHandlers() {
      monthsRoot.addEventListener(
        "pointerdown",
        (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          const hit = getCellFromTarget(e.target);
          if (!hit) return;
          if (!hit.cell.classList.contains("is-today")) return;
          if (hit.cell.getAttribute("data-has") !== "1") return;

          lpStartX = e.clientX;
          lpStartY = e.clientY;
          cancelLongPressTimer();
          lpTimer = window.setTimeout(() => {
            lpTimer = null;
            const rec = itemByDateKey(state.items, hit.dateKey);
            if (!rec) return;
            lastLongPressAt = Date.now();
            suppressClickAfterLongPress = true;
            if (suppressClearTimer) clearTimeout(suppressClearTimer);
            suppressClearTimer = setTimeout(() => {
              suppressClearTimer = null;
              suppressClickAfterLongPress = false;
            }, 700);
            state.items = removeItemByDateKey(state.items, hit.dateKey);
            state.index = rec.stepIndex;
            saveState(state);
            render();
          }, 550);
        },
        true
      );

      function cancelIfMove(e) {
        if (!lpTimer) return;
        const dx = Math.abs(e.clientX - lpStartX);
        const dy = Math.abs(e.clientY - lpStartY);
        if (dx > 12 || dy > 12) cancelLongPressTimer();
      }

      monthsRoot.addEventListener("pointermove", cancelIfMove, true);
      monthsRoot.addEventListener("pointerup", cancelLongPressTimer, true);
      monthsRoot.addEventListener("pointercancel", cancelLongPressTimer, true);
      monthsRoot.addEventListener("lostpointercapture", cancelLongPressTimer, true);
    }

    monthsRoot.addEventListener("contextmenu", (e) => {
      if (getCellFromTarget(e.target)) e.preventDefault();
    });

    attachPointerHandlers();

    resetBtn.addEventListener("click", () => {
      state.index = 0;
      saveState(state);
      render();
    });

    deleteBtn.addEventListener("click", () => {
      const input = window.prompt("输入密码");
      if (input !== DELETE_PASSWORD) return;
      state.items = [];
      state.index = 0;
      saveState(state);
      render();
    });

    render();
  </script>
</body>
</html>
